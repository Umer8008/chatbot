[project]
name = "local-mistral-chatbot"
version = "0.2.0"
description = "A local AI chatbot powered by Mistral 7B, LangChain, and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LangChain core + community (includes LlamaCpp integration)
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    # Local GGUF inference via llama.cpp Python bindings
    # NOTE: On Windows without VS Build Tools, install the pre-built wheel:
    #   uv pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
    "llama-cpp-python>=0.3",
    # Streamlit UI
    "streamlit>=1.40",
    # .env file loading
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
